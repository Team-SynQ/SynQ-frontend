name: Deploy production frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: synq-frontend-production-470276446236-ap-northeast-2-an
  CLOUDFRONT_DISTRIBUTION_ID: E1NU1A6OADETS6

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_REDIRECT_URI: ${{ vars.VITE_KAKAO_REDIRECT_URI }}
          VITE_KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::470276446236:role/SynQFrontendProductionDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync dist "s3://${S3_BUCKET}" --delete

      - name: Disable caching for index.html
        run: >-
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html"
          --cache-control "no-cache, no-store, must-revalidate"
          --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"
