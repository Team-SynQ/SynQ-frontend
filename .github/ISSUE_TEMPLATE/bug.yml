name: Bug
description: 버그 수정 작업
title: "[Fix] "
labels: ["fix", "bug"]
body:
  - type: textarea
    id: details
    attributes:
      label: 내용
      description: 버그를 간단히 설명하고, 필요한 내용을 아래 구역에 작성해주세요.
      value: |
        ## 간단 설명
        <!-- 예: 회의 전사 화면에서 스크롤이 최신 발화로 이동하지 않습니다. -->

        -

        ---

        ## 재현 방법
        <!-- 예: 1. 프로젝트 메인보드 진입 2. 회의 시작 3. 새 발화 생성 확인 -->

        1.
        2.
        3.

        ---

        ## 기대 결과
        <!-- 예: 최신 발화가 자동으로 화면 하단에 표시되어야 합니다. -->

        -

        ---

        ## 실제 결과
        <!-- 예: 이전 발화 위치에 머물러 새 발화가 보이지 않습니다. -->

        -
    validations:
      required: true