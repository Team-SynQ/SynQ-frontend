name: Feature
description: 새로운 기능 또는 화면 구현 작업
title: "[Feat] "
labels: ["feat"]
body:
  - type: textarea
    id: details
    attributes:
      label: 내용
      description: 작업을 간단히 설명하고, 필요한 내용을 아래 구역에 작성해주세요.
      value: |
        ## 간단 설명
        <!-- 예: 회의 중 발화별 SynQ 힌트 카드 UI를 추가합니다. -->

        -

        ---

        ## 작업 내용
        <!-- 예: 필요한 구현 내용을 자유롭게 작성해주세요. -->

        -

        ---

        ## 완료 조건
        <!-- 예: 주요 해상도에서 UI가 깨지지 않고, 필요한 데이터 상태가 반영됩니다. -->

        - [ ]
    validations:
      required: true